name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages deployment token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued pushes supersede rather than stack up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SPEC §2/§14 — the published URL and base path come from repository
      # variables, never from a hardcoded value in the source. Set SITE_URL to
      # the custom domain (or https://<user>.github.io/<repo>) and, only if the
      # site is served from a subpath, SITE_BASE to /<repo>/.
      SITE_URL: ${{ vars.SITE_URL || 'https://weedsofmelbourne.org' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the two search indexes, then the static site.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
