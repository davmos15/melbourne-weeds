name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages deployment token. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued pushes supersede rather than stack up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SPEC §2/§14 — the published URL and base path come from repository
      # variables, never from a hardcoded value in the source. The defaults are
      # this repo's Pages project site; set the variables to move to a domain
      # root (SITE_BASE: / and SITE_URL: the domain).
      SITE_URL: ${{ vars.SITE_URL || 'https://davmos15.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/melbourne-weeds/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the two search indexes, then the static site.
      - run: npm run build

      # This step fails until Pages is switched on for the repository:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # It is a one-time manual step. `enablement: true` cannot substitute for
      # it — creating a Pages site needs administration:write, which GITHUB_TOKEN
      # is not granted and the permissions: block above cannot ask for.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
